<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screening Forex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1420; --panel:#151D2C; --panel-2:#1B2536; --line:#243049;
    --text:#E7ECF5; --muted:#8B97AD; --faint:#5B6780;
    --buy:#2DD4BF; --sell:#F27059; --watch:#E8B44C;
    --buy-dim:rgba(45,212,191,.12); --sell-dim:rgba(242,112,89,.12);
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Archivo",system-ui,sans-serif;
    min-height:100vh; padding:24px 16px 48px;
  }
  .wrap{max-width:960px;margin:0 auto}
  .mono{font-family:"IBM Plex Mono",monospace}

  /* ---------- header ---------- */
  header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  h1{font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
  h1 span{color:var(--faint);font-weight:500}
  .meta{font-size:.78rem;color:var(--muted)}
  .meta .stale{color:var(--watch);font-weight:600}
  .meta .mode-tag{
    display:inline-block;background:var(--panel-2);border:1px solid var(--line);
    border-radius:5px;padding:1px 8px;margin-right:6px;color:var(--text);
    font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  }

  /* ---------- session bar (signature) ---------- */
  .sessions{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px 10px;margin-bottom:22px}
  .sessions .label{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
  .track{position:relative;height:26px;border-radius:6px;background:var(--panel-2);overflow:hidden}
  .band{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:600;letter-spacing:.05em;color:var(--muted)}
  .band.asia{background:rgba(139,151,173,.10)}
  .band.london{background:rgba(45,212,191,.10);color:var(--buy)}
  .band.ny{background:rgba(242,112,89,.10);color:var(--sell)}
  .now{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);box-shadow:0 0 6px rgba(231,236,245,.8)}
  .hours{display:flex;justify-content:space-between;font-size:.62rem;color:var(--faint);margin-top:5px}
  .next-run{font-size:.74rem;color:var(--muted);margin-top:8px}
  .next-run b{color:var(--text)}

  /* ---------- cards ---------- */
  .section-title{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:20px 2px 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .card.signal-BUY{border-left:3px solid var(--buy)}
  .card.signal-SELL{border-left:3px solid var(--sell)}
  .card.watch{opacity:.82}
  .card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .pair{font-size:1.05rem;font-weight:700;letter-spacing:.02em}
  .badges{display:flex;gap:6px}
  .badge{font-size:.66rem;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:5px;text-transform:uppercase}
  .badge.BUY{background:var(--buy-dim);color:var(--buy)}
  .badge.SELL{background:var(--sell-dim);color:var(--sell)}
  .badge.WATCH{background:rgba(232,180,76,.12);color:var(--watch)}
  .badge.trend{background:var(--panel-2);color:var(--muted)}
  .levels{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:.82rem}
  .lv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
  .lv .k{color:var(--muted)}
  .lv .v{font-weight:500}
  .lv.entry .v{font-weight:600}
  .lv.sl .v{color:var(--sell)}
  .lv.tp .v{color:var(--buy)}
  .sub{font-size:.72rem;color:var(--faint);margin-top:9px;display:flex;justify-content:space-between}

  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;color:var(--muted);font-size:.85rem}
  .error{border-color:var(--sell);color:var(--sell)}
  footer{margin-top:34px;font-size:.7rem;color:var(--faint);text-align:center}
  @media (prefers-reduced-motion:no-preference){
    .card{transition:transform .12s ease}
    .card:hover{transform:translateY(-2px)}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Screening Forex <span>/ session breakout H1</span></h1>
    <div class="meta" id="meta">Memuat…</div>
  </header>

  <div class="sessions">
    <div class="label">Sesi pasar hari ini (WIB)</div>
    <div class="track" id="track"></div>
    <div class="hours"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
    <div class="next-run" id="nextRun"></div>
  </div>

  <div id="content"><div class="empty">Memuat signals.json…</div></div>

  <footer>Alat bantu screening pribadi — bukan saran finansial. Data: Yahoo Finance (delay).</footer>
</div>

<script>
(function(){
  // ---------- strip sesi (jam WIB) ----------
  // Asia 07-14, London 14-22, NY 19-04(+1) WIB
  var track = document.getElementById('track');
  function band(cls, name, from, to){
    var el = document.createElement('div');
    el.className = 'band ' + cls;
    el.style.left = (from/24*100) + '%';
    el.style.width = ((to-from)/24*100) + '%';
    el.textContent = name;
    track.appendChild(el);
  }
  band('asia','ASIA',7,14);
  band('london','LONDON',14,22);
  band('ny','NY',19,24);
  band('ny','',0,4);

  function wibNow(){
    var now = new Date();
    return new Date(now.getTime() + (now.getTimezoneOffset() + 7*60)*60000);
  }
  var w = wibNow();
  var frac = (w.getHours() + w.getMinutes()/60) / 24;
  var mark = document.createElement('div');
  mark.className = 'now';
  mark.style.left = (frac*100) + '%';
  track.appendChild(mark);

  // run berikutnya: 15:15 (London) & 20:15 (NY) WIB, Sen-Jum
  var runs = [[15,15,'London'],[20,15,'New York']];
  var next = null, hNow = w.getHours()*60 + w.getMinutes(), day = w.getDay();
  if (day >= 1 && day <= 5){
    for (var i=0;i<runs.length;i++){
      if (runs[i][0]*60+runs[i][1] > hNow){ next = runs[i]; break; }
    }
  }
  document.getElementById('nextRun').innerHTML = next
    ? 'Run berikutnya: <b>' + next[2] + '</b> pukul <b>' +
      String(next[0]).padStart(2,'0') + ':' + String(next[1]).padStart(2,'0') + ' WIB</b>'
    : (day===0 || day===6 ? 'Akhir pekan — pasar tutup.' : 'Run hari ini selesai. Berikutnya: London 15:15 WIB.');

  // ---------- muat sinyal ----------
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function relTime(iso){
    var mins = Math.round((Date.now() - new Date(iso).getTime())/60000);
    if (mins < 60) return mins + ' menit lalu';
    var h = Math.round(mins/60);
    if (h < 24) return h + ' jam lalu';
    return Math.round(h/24) + ' hari lalu';
  }

  function card(s){
    var watch = s.status === 'WATCH';
    return '<div class="card signal-' + esc(s.direction) + (watch?' watch':'') + '">' +
      '<div class="card-top">' +
        '<div class="pair mono">' + esc(s.pair) + '</div>' +
        '<div class="badges">' +
          (watch ? '<span class="badge WATCH">Watch</span>' : '') +
          '<span class="badge ' + esc(s.direction) + '">' + esc(s.direction) + '</span>' +
          '<span class="badge trend">H4 ' + (s.trend_h4==='up'?'▲':'▼') + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="levels mono">' +
        '<div class="lv entry"><span class="k">' + (watch?'Entry (pending)':'Entry') + '</span><span class="v">' + esc(s.entry) + '</span></div>' +
        '<div class="lv"><span class="k">Harga</span><span class="v">' + esc(s.price) + '</span></div>' +
        '<div class="lv sl"><span class="k">SL</span><span class="v">' + esc(s.sl) + '</span></div>' +
        '<div class="lv tp"><span class="k">TP1</span><span class="v">' + esc(s.tp1) + '</span></div>' +
        '<div class="lv"><span class="k">Range</span><span class="v">' + esc(s.range_low) + '–' + esc(s.range_high) + '</span></div>' +
        '<div class="lv tp"><span class="k">TP2</span><span class="v">' + esc(s.tp2) + '</span></div>' +
      '</div>' +
      '<div class="sub"><span>ATR H1: <span class="mono">' + esc(s.atr_h1) + '</span></span>' +
      '<span>SL: <span class="mono">' + esc(s.sl_pips) + '</span> pip</span></div>' +
    '</div>';
  }

  fetch('signals.json?t=' + Date.now())
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data){
      var mins = (Date.now() - new Date(data.generated_at).getTime())/60000;
      var stale = mins > 8*60;
      document.getElementById('meta').innerHTML =
        '<span class="mode-tag">' + esc(data.mode) + '</span>' +
        '<span class="' + (stale?'stale':'') + '">diperbarui ' + relTime(data.generated_at) +
        (stale?' — data lama':'') + '</span>';

      var sig = data.signals.filter(function(s){ return s.status === 'SIGNAL'; });
      var wat = data.signals.filter(function(s){ return s.status !== 'SIGNAL'; });
      var html = '';
      html += '<div class="section-title">Sinyal aktif (' + sig.length + ')</div>';
      html += sig.length
        ? '<div class="grid">' + sig.map(card).join('') + '</div>'
        : '<div class="empty">Belum ada breakout terkonfirmasi sesi ini. Pantau level pending di bawah.</div>';
      if (wat.length){
        html += '<div class="section-title">Pantau — menunggu breakout (' + wat.length + ')</div>';
        html += '<div class="grid">' + wat.map(card).join('') + '</div>';
      }
      document.getElementById('content').innerHTML = html;
    })
    .catch(function(e){
      document.getElementById('content').innerHTML =
        '<div class="empty error">Gagal memuat signals.json (' + esc(e.message) +
        '). Pastikan workflow sudah pernah jalan dan file ada di root repo.</div>';
      document.getElementById('meta').textContent = '';
    });
})();
</script>
</body>
</html>
